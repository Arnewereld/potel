# Starten op een server:  docker compose up -d
# Zet er een reverse proxy met https voor (bijvoorbeeld Caddy) en vul hieronder je eigen gegevens in.
services:
  potel:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - potel-data:/data
    environment:
      BehindProxy: "true"
      # Alleen doorgestuurde IP-adressen van je eigen proxy vertrouwen. 172.16.0.0/12 is het standaardnetwerk van Docker;
      # staat je proxy ergens anders, zet dan zijn netwerk hier of zijn IP-adres bij KnownProxies__0.
      KnownNetworks__0: "172.16.0.0/12"
      # Jij als eigenaar: het account met dit e-mailadres ziet de pagina Platform met alle klanten. Dat recht wordt
      # bij het opstarten toegekend zolang er nog geen platformbeheerder is; daarna wijs je anderen aan op Platform.
      PlatformAdmins__0: "jij@jouwdomein.nl"
      # Je eigen account: het veiligst maak je het hier aan, vóór de eerste start. Meld je je aan via /aanmelden,
      # herstart de container dan één keer om toegang tot Platform te krijgen.
      # Admin__Name: "Jouw naam"
      # Admin__Email: "jij@jouwdomein.nl"
      # Admin__Password: "..."
      # Mail voor werkstromen (optioneel)
      # Smtp__Host: "smtp.jouwprovider.nl"
      # Smtp__User: "..."
      # Smtp__Password: "..."
      # Smtp__From: "noreply@jouwdomein.nl"
volumes:
  potel-data:
